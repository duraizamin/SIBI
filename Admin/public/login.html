<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in | Sibi Sports Club</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand brand-image" href="/"><img src="/sibi-logo.png" alt="Sibi Sports Club"></a>
      <a class="btn ghost" href="/">← Back to website</a>
    </div>
  </header>
  <main class="auth-wrap">
    <div class="wrap">
      <div class="auth-layout">
        <aside class="auth-promo">
          <a class="brand brand-image" href="/"><img src="/sibi-logo.png" alt="Sibi Sports Club"></a>
          <div>
            <div class="eyebrow">Secure account access</div>
            <h1>Your club.<br><span>Your progress.</span></h1>
          </div>
          <span class="small">TRAIN WITH PURPOSE · SIBI SPORTS CLUB</span>
        </aside>
        <form class="auth-form" id="loginForm">
          <div class="eyebrow">Welcome back</div>
          <h2>Sign in</h2>
          <div class="field">
            <label for="email">Email or member ID</label>
            <input id="email" autocomplete="username" required placeholder="Enter your email or member ID">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn primary">Continue securely ↗</button>
          <p class="auth-note" id="formMessage" role="status"></p>
        </form>
      </div>
    </div>
  </main>
  <script src="/auth.js"></script>
</body>
</html>
